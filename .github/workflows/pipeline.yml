name: Unified CI/CD Pipeline

on:
  push:
    branches: ['main', 'testing', 'develop']
  pull_request:
    branches: ['main', 'testing', 'develop']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

# ============================================================================
# STAGE 1: CI (Continuous Integration)
# Validaciones en cualquier push, PR o ejecución manual
# ============================================================================
jobs:
  ci-secrets:
    name: CI — Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets — Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-backend:
    name: CI — Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download Go dependencies
        working-directory: backend
        run: go mod download

      - name: Build backend
        working-directory: backend
        run: go build ./...

  ci-frontend:
    name: CI — Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Angular (production)
        working-directory: frontend
        run: pnpm exec ng build

  ci-gate:
    name: CI — Gate
    runs-on: ubuntu-latest
    needs: [ci-secrets, ci-backend, ci-frontend]
    if: always()
    steps:
      - name: Verify CI Status
        run: |
          if [ "${{ needs.ci-secrets.result }}" != "success" ]; then
            echo "::error::ci-secrets failed."
            exit 1
          fi
          if [ "${{ needs.ci-backend.result }}" != "success" ]; then
            echo "::error::ci-backend failed."
            exit 1
          fi
          if [ "${{ needs.ci-frontend.result }}" != "success" ]; then
            echo "::error::ci-frontend failed."
            exit 1
          fi
          echo "All CI validations passed."

# ============================================================================
# STAGE 2: CD SETUP (Determine Environment)
# Solo corre para 'testing' (ambiente TESTING) o 'main' (ambiente PROD)
# ============================================================================
  cd-setup:
    name: CD — Setup Environment
    runs-on: ubuntu-latest
    needs: [ci-gate]
    if: (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'testing' || github.base_ref == 'main' || github.base_ref == 'testing') && github.ref_name != 'develop' && github.base_ref != 'develop'
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
      service_suffix: ${{ steps.env.outputs.service_suffix }}
    steps:
      - name: Determine environment
        id: env
        run: |
          TARGET="${{ github.base_ref || github.ref_name }}"
          if [ "$TARGET" = "main" ]; then
            echo "env_name=PROD" >> $GITHUB_OUTPUT
            echo "service_suffix=prod" >> $GITHUB_OUTPUT
          elif [ "$TARGET" = "testing" ]; then
            echo "env_name=TESTING" >> $GITHUB_OUTPUT
            echo "service_suffix=testing" >> $GITHUB_OUTPUT
          else
            echo "::error::Rama '$TARGET' no configurada para despliegue."
            exit 1
          fi

# ============================================================================
# STAGE 3: BUILD & PUSH BACKEND IMAGE (Docker Hub)
# ============================================================================
  build-push-backend:
    name: Build & Push Backend Image to Docker Hub
    runs-on: ubuntu-latest
    needs: [ci-gate, cd-setup]
    environment: ${{ needs.cd-setup.outputs.env_name }}
    if: (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'testing' || github.base_ref == 'main' || github.base_ref == 'testing') && github.ref_name != 'develop' && github.base_ref != 'develop'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sistema-entradas-backend:${{ needs.cd-setup.outputs.service_suffix }}-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sistema-entradas-backend:${{ needs.cd-setup.outputs.service_suffix }}

# ============================================================================
# STAGE 4: CD — DEPLOY BACKEND (Cloud Run)
# ============================================================================
  cd-deploy-backend:
    name: CD — Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    needs: [cd-setup, build-push-backend]
    environment: ${{ needs.cd-setup.outputs.env_name }}
    outputs:
      service_url: ${{ steps.deploy-backend.outputs.url }}
    steps:
      - name: Authenticate GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'sistema-entradas-backend-${{ needs.cd-setup.outputs.service_suffix }}'
          region: '${{ secrets.GCP_REGION }}'
          project_id: '${{ secrets.GCP_PROJECT_ID }}'
          image: '${{ secrets.DOCKERHUB_USERNAME }}/sistema-entradas-backend:${{ needs.cd-setup.outputs.service_suffix }}-${{ github.sha }}'
          flags: '--allow-unauthenticated --min-instances=0 --max-instances=1 --cpu=1 --memory=4Gi --service-account=${{ secrets.GCP_SERVICE_ACCOUNT }}'
          env_vars: |-
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRATION_MINUTES=${{ secrets.JWT_ACCESS_EXPIRATION_MINUTES }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            INITIAL_ADMIN_EMAIL=${{ secrets.INITIAL_ADMIN_EMAIL }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_CREDENTIALS_JSON=${{ secrets.FIREBASE_CREDENTIALS_JSON }}

# ============================================================================
# STAGE 5: CD — DEPLOY FRONTEND (Cloudflare Pages)
# ============================================================================
  cd-deploy-frontend:
    name: CD — Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [cd-setup, cd-deploy-backend]
    environment: ${{ needs.cd-setup.outputs.env_name }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Inject API URL into env.js
        working-directory: frontend
        run: |
          export API_URL="${{ needs.cd-deploy-backend.outputs.service_url }}"
          if [ -z "$API_URL" ]; then
            echo "::error::service_url output is empty. Cannot inject API_URL."
            exit 1
          fi
          envsubst < src/assets/env.template.js > src/assets/env.js
          echo "Injected API_URL: $API_URL into env.js"

      - name: Build Angular (production)
        working-directory: frontend
        run: pnpm exec ng build

      - name: Deploy to Cloudflare Pages
        id: deploy-cf
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy ./frontend/dist/frontend/browser
            --project-name=${{ secrets.CLOUDFLARE_PROJECT }}
            --branch=${{ github.ref_name }}

      - name: Display Cloudflare Deployment URL
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            URL="https://${{ secrets.CLOUDFLARE_PROJECT }}.pages.dev"
          else
            URL="https://${{ github.ref_name }}.${{ secrets.CLOUDFLARE_PROJECT }}.pages.dev"
          fi
          echo "### 🚀 Cloudflare Pages Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.cd-setup.outputs.env_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** $URL" >> $GITHUB_STEP_SUMMARY