<div [class.has-bottom-nav]="authService.isAuthenticated()">
  <app-navbar></app-navbar>
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
  <app-footer></app-footer>
  <app-toast-container></app-toast-container>

  <!-- Global Desktop Floating Action Button (FAB) for emitting new ticket -->
  <button *ngIf="authService.isAuthenticated()"
          type="button"
          class="desktop-fab-issue-btn"
          (click)="openQuickSaleDrawer()"
          title="Emitir Nueva Entrada / Bono"
          aria-label="Emitir Nueva Entrada">
    <svg class="icon fab-icon" viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 1-2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
    <span class="fab-text">Emitir Entrada</span>
  </button>

  <!-- Mobile Bottom Dock & Quick Sale Drawer -->
  <app-bottom-nav (openQuickSale)="openQuickSaleDrawer()"></app-bottom-nav>
  <app-quick-sale-drawer 
    [isOpen]="quickSaleService.isOpen()" 
    (closeDrawer)="closeQuickSaleDrawer()"
    (ticketCreated)="onTicketCreated()">
  </app-quick-sale-drawer>
</div>
