    // --- COMPONENTE QR AUTOMÁTICO ---
    function QRRenderer({ text, size = 140 }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;
        containerRef.current.innerHTML = '';
        try {
          if (window.QRCode) {
            new window.QRCode(containerRef.current, {
              text: text || 'BONO',
              width: size,
              height: size,
              colorDark: '#521423',
              colorLight: '#ffffff',
              correctLevel: window.QRCode.CorrectLevel.M,
            });
          }
        } catch (e) {
          console.warn('QR rendering fallback', e);
        }
      }, [text, size]);

      return (
        <div className="flex flex-col items-center justify-center p-2 bg-white rounded-xl shadow-inner border border-wine-100">
          <div ref={containerRef} className="flex justify-center items-center"></div>
        </div>
      );
    }

    // --- ICONOS SVG LIMPIOS ---
    const Icons = {
      Dashboard: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>,
      Ticket: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 001 1.712V14a2 2 0 00-1 1.712V17a2 2 0 002 2h14a2 2 0 002-2v-2.288A2 2 0 0021 14v-2.288A2 2 0 0022 10V7a2 2 0 00-2-2H5z"/></svg>,

      Products: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>,

      Logout: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>,

      Eye: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>,
      EyeOff: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.02 10.02 0 012.122-.063c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m-6.165-3.693a3 3 0 11-4.243-4.243m4.243 4.243L3 3l18 18"/></svg>,
      ArrowLeft: () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>,
      Menu: () => <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"/></svg>,

    // --- COMPONENTE PRINCIPAL APP ---
    function App() {
      const [user, setUser] = useState(() => {
        try {
          const s = localStorage.getItem('bono_v3_user');
          return s ? JSON.parse(s) : { email: 'admin@test.com', role: 'ADMIN', name: 'Administrador Principal', sellerId: null };
        } catch { return { email: 'admin@test.com', role: 'ADMIN', name: 'Administrador Principal', sellerId: null }; }
      });

      const [bonds, setBonds] = useState(() => {
        try {
          const s = localStorage.getItem('bono_v3_bonds');
          return s ? JSON.parse(s) : INITIAL_BONDS;
        } catch { return INITIAL_BONDS; }
      });

      const [products, setProducts] = useState(() => {
        try {
          const s = localStorage.getItem('bono_v3_products');
          return s ? JSON.parse(s) : INITIAL_PRODUCTS;
        } catch { return INITIAL_PRODUCTS; }
      });

      const [sellers, setSellers] = useState(() => {
        try {
          const s = localStorage.getItem('bono_v3_sellers');
          return s ? JSON.parse(s) : INITIAL_SELLERS;
        } catch { return INITIAL_SELLERS; }
      });

      const [simplePrice, setSimplePrice] = useState(() => {
        try {
          const s = localStorage.getItem('bono_v3_simple_price');
          return s ? JSON.parse(s) : INITIAL_SIMPLE_PRICE;
        } catch { return INITIAL_SIMPLE_PRICE; }
      });

      const [currentRoute, setCurrentRoute] = useState('dashboard');
      const [selectedBondId, setSelectedBondId] = useState('bond-125');
      const [publicToken, setPublicToken] = useState('tok-125-xyz');
      const [toastMsg, setToastMsg] = useState(null);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Modal personalizado sin alert()
      const [modalState, setModalState] = useState({ open: false, title: '', message: '', type: 'info', onConfirm: null });

      useEffect(() => { localStorage.setItem('bono_v3_user', JSON.stringify(user)); }, [user]);
      useEffect(() => { localStorage.setItem('bono_v3_bonds', JSON.stringify(bonds)); }, [bonds]);
      useEffect(() => { localStorage.setItem('bono_v3_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('bono_v3_sellers', JSON.stringify(sellers)); }, [sellers]);
      useEffect(() => { localStorage.setItem('bono_v3_simple_price', JSON.stringify(simplePrice)); }, [simplePrice]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3200);
      };

      const showModal = (title, message, type = 'info', onConfirm = null) => {
        setModalState({ open: true, title, message, type, onConfirm });
      };

      const closeModal = () => {
        setModalState((prev) => ({ ...prev, open: false }));
      };

      const handleLogin = (email, role) => {
        const newUser = {
          email,
          role,
          name: role === 'ADMIN' ? 'Administrador General' : 'Vendedor Registrado',
          sellerId: role === 'VENDEDOR' ? 'sel-1' : null,
        };
        setUser(newUser);
        setCurrentRoute('dashboard');
        showToast(`Sesión iniciada como ${newUser.name}`);
      };

      const handleLogout = () => {
        setUser(null);
        setCurrentRoute('login');
      };

      const navigateTo = (route, param = null) => {
        if (route === 'bonos/detail') setSelectedBondId(param);
        if (route === 'public') setPublicToken(param || 'tok-125-xyz');
        setCurrentRoute(route);
        setMobileMenuOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const resetDemoData = () => {
        showModal(
          'Restablecer Datos de Demostración',
          '¿Desea volver a cargar los datos originales de prueba? Esto reiniciará bonos, precios y productos.',
          'danger',
          () => {
            localStorage.clear();
            setProducts(INITIAL_PRODUCTS);
            setSellers(INITIAL_SELLERS);
            setBonds(INITIAL_BONDS);
            setSimplePrice(INITIAL_SIMPLE_PRICE);
            showToast('Datos de demo restablecidos con éxito');
          }
        );
      };

      return (
        <div className="min-h-screen bg-wine-50 text-gray-800 flex flex-col">
          {/* Toast Notification flotante */}
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-50 bg-wine-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-wine-700 animate-bounce">
              <span className="w-2.5 h-2.5 bg-emerald-400 rounded-full"></span>
              <span className="text-sm font-semibold">{toastMsg}</span>
            </div>
          )}

          {/* Modal Personalizado */}
          {modalState.open && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-wine-200">
                <div className="flex items-center gap-3 border-b border-gray-100 pb-3">
                  <div className={`p-2.5 rounded-2xl text-xl ${modalState.type === 'danger' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-900'}`}>
                    {modalState.type === 'danger' ? '⚠️' : 'ℹ️'}
                  </div>
                  <h3 className="font-bold text-wine-900 text-lg">{modalState.title}</h3>
                </div>
                <div className="text-sm text-gray-700 whitespace-pre-line leading-relaxed">
                  {modalState.message}
                </div>
                <div className="flex justify-end gap-2 pt-3 border-t border-gray-100">
                  {modalState.onConfirm ? (
                    <>
                      <button onClick={closeModal} className="px-4 py-2 border border-gray-300 rounded-xl text-sm font-medium hover:bg-gray-50">
                        Cancelar
                      </button>
                      <button onClick={() => { if (modalState.onConfirm) modalState.onConfirm(); closeModal(); }} className="px-5 py-2 bg-wine-800 hover:bg-wine-900 text-white rounded-xl text-sm font-bold shadow-md">
                        Confirmar
                      </button>
                    </>
                  ) : (
                    <button onClick={closeModal} className="px-6 py-2 bg-wine-800 hover:bg-wine-900 text-white rounded-xl text-sm font-bold shadow-md">
                      Entendido
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Barra superior de Demostración y Simulación */}
          <div className="bg-wine-950 text-white px-4 py-2 text-xs flex flex-wrap justify-between items-center border-b border-wine-900 gap-2">
            <div className="flex items-center gap-2">
              <span className="bg-wine-700 px-2 py-0.5 rounded text-[11px] font-bold uppercase tracking-wider">Prototipo Interactivo</span>
              <span className="text-wine-200 hidden sm:inline">Ejecutable en local (Sin Node.js)</span>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-wine-300">Simular Rol:</span>
              <button
                onClick={() => handleLogin('admin@test.com', 'ADMIN')}
                className={`px-2.5 py-1 rounded text-xs transition-all ${user?.role === 'ADMIN' ? 'bg-white text-wine-950 font-bold shadow' : 'bg-wine-800 hover:bg-wine-700 text-white'}`}
              >
                Admin
              </button>
              <button
                onClick={() => handleLogin('vendedor@test.com', 'VENDEDOR')}
                className={`px-2.5 py-1 rounded text-xs transition-all ${user?.role === 'VENDEDOR' ? 'bg-white text-wine-950 font-bold shadow' : 'bg-wine-800 hover:bg-wine-700 text-white'}`}
              >
                Vendedor
              </button>
              <button
                onClick={() => navigateTo('public', 'tok-125-xyz')}
                className="px-2.5 py-1 rounded text-xs bg-amber-600 hover:bg-amber-500 text-white font-bold flex items-center gap-1 shadow-sm"
              >
                <Icons.ExternalLink /> Ver Pase Público (#125)
              </button>
              <button
                onClick={resetDemoData}
                title="Reiniciar datos de prueba"
                className="px-2 py-1 rounded text-xs text-wine-300 hover:text-white underline ml-1"
              >
                Reiniciar demo
              </button>
            </div>
          </div>

          {/* Rutas principales */}
          {currentRoute === 'login' ? (
            <LoginView onLogin={handleLogin} />
          ) : currentRoute === 'public' ? (
            <PublicBondView token={publicToken} bonds={bonds} onNavigateBack={() => navigateTo('dashboard')} />
          ) : (
            <div className="flex-1 flex flex-col md:flex-row">
              {/* Barra Lateral (Sidebar) */}
              <aside className={`md:w-64 bg-white border-r border-wine-200 flex flex-col justify-between ${mobileMenuOpen ? 'block' : 'hidden md:flex'}`}>
                <div>
                  <div className="p-5 border-b border-wine-100 flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-wine-800 text-white flex items-center justify-center font-bold text-xl shadow-md">
                      🍷
                    </div>
                    <div>
                      <h1 className="font-extrabold text-wine-900 text-lg leading-tight">Bono Pass</h1>
                      <p className="text-xs text-wine-500 font-medium">Eventos & Consumición</p>
                    </div>
                  </div>

                  {/* Tarjeta de Usuario Activo */}
                  <div className="p-4 mx-3 my-3 bg-wine-50 rounded-2xl border border-wine-200">
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-wine-800 text-white uppercase tracking-wider">
                        {user?.role}
                      </span>
                    </div>
                    <p className="text-sm font-bold text-gray-800 truncate">{user?.name}</p>
                    <p className="text-xs text-gray-500 truncate">{user?.email}</p>
                  </div>

                  {/* Menú de Navegación */}
                  <nav className="px-3 space-y-1">
                    <NavItem icon={<Icons.Dashboard />} label="Dashboard" active={currentRoute === 'dashboard'} onClick={() => navigateTo('dashboard')} />
                    <NavItem icon={<Icons.Ticket />} label={user?.role === 'ADMIN' ? 'Todos los Bonos' : 'Mis Bonos'} active={currentRoute === 'bonos' || currentRoute === 'bonos/detail'} onClick={() => navigateTo('bonos')} />

    // --- VISTA CREACIÓN DE BONOS (Requerimientos 7 al 13) ---
    function BondCreateView({ products, simplePrice, user, onBondCreated, navigateTo, showModal }) {
      const [step, setStep] = useState(1);
      const [bondType, setBondType] = useState('SIMPLE');
      const [itemQuantities, setItemQuantities] = useState({});
      const [buyer, setBuyer] = useState({ name: '', lastName: '', phone: '', email: '' });

      useEffect(() => {
        const init = {};
        products.forEach(p => { init[p.id] = 0; });
        setItemQuantities(init);
      }, [products]);

      const activeProducts = products.filter(p => p.active);

      const calculateFoodTotal = () => {
        return activeProducts.reduce((sum, p) => {
          const qty = itemQuantities[p.id] || 0;
          return sum + (qty * p.unitPrice);
        }, 0);
      };

      const handleNextFromProducts = () => {
        const totalUnits = Object.values(itemQuantities).reduce((a, b) => a + b, 0);
        if (totalUnits <= 0) {
          showModal('Sin productos seleccionados', 'Para un bono con comida debe seleccionar al menos 1 producto con cantidad mayor a cero.', 'warning');
          return;
        }
        setStep(3);
      };

      const handleGenerateBond = () => {
        if (!buyer.name || !buyer.lastName || !buyer.phone) {
          showModal('Datos incompletos', 'Por favor complete los campos obligatorios del comprador (Nombre, Apellido, Teléfono).', 'warning');
          return;
        }

        const items = bondType === 'CON_COMIDA'
          ? activeProducts
              .filter(p => (itemQuantities[p.id] || 0) > 0)
              .map(p => ({
                productId: p.id,
                productName: p.name,
                quantity: itemQuantities[p.id],
                unitPrice: p.unitPrice,
                subtotal: itemQuantities[p.id] * p.unitPrice,
              }))
          : [];

        const finalPrice = bondType === 'SIMPLE' ? simplePrice : calculateFoodTotal();
        const newNumber = Math.floor(100 + Math.random() * 900);
        const newCode = Math.floor(1000 + Math.random() * 9000).toString(); // Código único de 4 cifras

        const newBond = {
          id: `bond-${Date.now()}`,
          number: newNumber,
          type: bondType,
          price: finalPrice,
          sellerId: user?.sellerId || 'sel-1',
          sellerName: user?.name || 'Vendedor General',
          buyer: { ...buyer },
          items,
          status: 'VENDIDO',
          publicToken: `tok-${newNumber}-${Math.random().toString(36).substring(2, 7)}`,
          code: newCode,
          createdAt: new Date().toISOString(),
        };

        onBondCreated(newBond);
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6">
          <div className="flex items-center gap-3">
            <button onClick={() => navigateTo('bonos')} className="p-2 hover:bg-wine-100 text-wine-800 rounded-2xl">
              <Icons.ArrowLeft />
            </button>
            <div>
              <h1 className="text-2xl font-extrabold text-wine-900">Emitir Nuevo Bono</h1>
              <p className="text-sm text-gray-500">Paso {step} de {bondType === 'CON_COMIDA' ? '4' : '3'}</p>
            </div>
          </div>

          {/* Indicador de Pasos */}
          <div className="flex justify-between items-center bg-white p-4 rounded-3xl border border-wine-100 shadow-sm">
            {['1. Tipo', bondType === 'CON_COMIDA' ? '2. Productos' : '2. Comprador', bondType === 'CON_COMIDA' ? '3. Comprador' : '3. Resumen', '4. Resumen'].slice(0, bondType === 'CON_COMIDA' ? 4 : 3).map((lbl, idx) => {
              const num = idx + 1;
              const isAct = step === num;
              const isDone = step > num;
              return (
                <div key={idx} className="flex items-center gap-2">
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${isAct ? 'bg-wine-800 text-white shadow' : isDone ? 'bg-emerald-600 text-white' : 'bg-gray-100 text-gray-400'}`}>
                    {isDone ? '✓' : num}
                  </div>
                  <span className={`text-xs font-bold hidden sm:inline ${isAct ? 'text-wine-900' : 'text-gray-400'}`}>{lbl}</span>
                </div>
              );
            })}
          </div>

          {/* PASO 1: Selección de Tipo */}
          {step === 1 && (
            <div className="space-y-4">
              <h3 className="font-extrabold text-wine-900 text-lg">¿Qué bono desea emitir?</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div
                  onClick={() => setBondType('SIMPLE')}
                  className={`p-6 rounded-3xl border-2 cursor-pointer transition-all ${
                    bondType === 'SIMPLE' ? 'border-wine-800 bg-wine-50/70 shadow-md ring-2 ring-wine-800/20' : 'border-gray-200 bg-white hover:border-wine-300'
                  }`}
                >
                  <div className="flex justify-between items-start mb-2">
                    <span className="text-xs px-2.5 py-1 bg-blue-100 text-blue-900 rounded-full font-bold">BONO SIMPLE</span>
                    <span className="text-2xl font-extrabold text-wine-800">${simplePrice.toLocaleString()}</span>
                  </div>
                  <h4 className="font-bold text-gray-800 text-lg mt-2">Entrada General</h4>
                  <p className="text-xs text-gray-500 mt-1">Acceso al evento. No incluye consumición de comida.</p>
                </div>

                <div
                  onClick={() => setBondType('CON_COMIDA')}
                  className={`p-6 rounded-3xl border-2 cursor-pointer transition-all ${
                    bondType === 'CON_COMIDA' ? 'border-wine-800 bg-wine-50/70 shadow-md ring-2 ring-wine-800/20' : 'border-gray-200 bg-white hover:border-wine-300'
                  }`}
                >
                  <div className="flex justify-between items-start mb-2">
                    <span className="text-xs px-2.5 py-1 bg-amber-100 text-amber-900 rounded-full font-bold">BONO CON COMIDA</span>
                    <span className="text-xs font-bold bg-amber-50 text-amber-900 px-2 py-1 rounded">Precio variable</span>
                  </div>
                  <h4 className="font-bold text-gray-800 text-lg mt-2">Personalizado con Menú</h4>
                  <p className="text-xs text-gray-500 mt-1">Permite armar el menú seleccionando cantidades individuales.</p>
                </div>
              </div>

              <div className="flex justify-end pt-4">
                <button
                  onClick={() => setStep(bondType === 'CON_COMIDA' ? 2 : 2)}
                  className="px-6 py-3 bg-wine-800 hover:bg-wine-900 text-white font-bold rounded-2xl text-sm shadow-md"
                >
                  Siguiente →
                </button>
              </div>
            </div>
          )}

          {/* PASO 2: Selección de Comida (Solo para CON_COMIDA) */}
          {step === 2 && bondType === 'CON_COMIDA' && (
            <div className="space-y-4">
              <div className="flex justify-between items-center">
                <div>
                  <h3 className="font-extrabold text-wine-900 text-lg">Seleccionar productos y cantidades</h3>
                  <p className="text-xs text-gray-500">Ajuste las unidades requeridas para este bono</p>
                </div>
                <div className="text-right">
                  <span className="text-xs text-gray-400 font-bold uppercase block">Total Pedido</span>
                  <span className="text-xl font-extrabold text-wine-800">${calculateFoodTotal().toLocaleString()}</span>

              <div className="bg-white p-6 rounded-3xl border border-wine-100 space-y-3 shadow-sm">
                {activeProducts.map((p) => {

                    <div key={p.id} className="flex items-center justify-between p-3.5 bg-wine-50/60 rounded-2xl border border-wine-100">
                      <div>
                        <span className="font-bold text-gray-800 text-sm block">{p.name}</span>

                          type="button"

                        >
                          -
                        </button>
                        <span className="w-8 text-center font-extrabold text-wine-900 text-lg">{qty}</span>
                        <button
                          type="button"
                          onClick={() => setItemQuantities({ ...itemQuantities, [p.id]: qty + 1 })}
                          className="w-9 h-9 rounded-xl bg-wine-800 text-white font-bold hover:bg-wine-900 flex items-center justify-center text-lg shadow-sm"
                        >
                          +
                        </button>
                      </div>
                    </div>

              <div className="flex justify-between pt-4">
                <button onClick={() => setStep(1)} className="px-5 py-2.5 border border-gray-300 text-gray-700 font-bold rounded-2xl text-sm">
                  Volver
                </button>
                <button onClick={handleNextFromProducts} className="px-6 py-2.5 bg-wine-800 hover:bg-wine-900 text-white font-bold rounded-2xl text-sm shadow-md">
                  Siguiente →
                </button>
              </div>
            </div>
          )}

          {/* PASO: Datos del Comprador */}
          {((step === 2 && bondType === 'SIMPLE') || (step === 3 && bondType === 'CON_COMIDA')) && (
            <div className="space-y-4">
              <h3 className="font-extrabold text-wine-900 text-lg">Datos del Comprador</h3>
              <div className="bg-white p-6 rounded-3xl border border-wine-100 grid grid-cols-1 md:grid-cols-2 gap-4 shadow-sm">
                <div>
                  <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Nombre *</label>
                  <input
                    type="text"
                    value={buyer.name}
                    onChange={(e) => setBuyer({ ...buyer, name: e.target.value })}
                    required
                    className="w-full px-4 py-2.5 rounded-2xl border border-gray-200 text-sm focus:ring-2 focus:ring-wine-800"
                    placeholder="Juan"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Apellido *</label>
                  <input
                    type="text"
                    value={buyer.lastName}
                    onChange={(e) => setBuyer({ ...buyer, lastName: e.target.value })}
                    required
                    className="w-full px-4 py-2.5 rounded-2xl border border-gray-200 text-sm focus:ring-2 focus:ring-wine-800"
                    placeholder="Pérez"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Teléfono *</label>
                  <input
                    type="text"
                    value={buyer.phone}
                    onChange={(e) => setBuyer({ ...buyer, phone: e.target.value })}
                    required
                    className="w-full px-4 py-2.5 rounded-2xl border border-gray-200 text-sm focus:ring-2 focus:ring-wine-800"
                    placeholder="3512345678"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Email (Opcional)</label>
                  <input
                    type="email"
                    value={buyer.email}
                    onChange={(e) => setBuyer({ ...buyer, email: e.target.value })}
                    className="w-full px-4 py-2.5 rounded-2xl border border-gray-200 text-sm focus:ring-2 focus:ring-wine-800"
                    placeholder="juan.perez@email.com"
                  />
                </div>
              </div>

              <div className="flex justify-between pt-4">
                <button onClick={() => setStep(bondType === 'CON_COMIDA' ? 2 : 1)} className="px-5 py-2.5 border border-gray-300 text-gray-700 font-bold rounded-2xl text-sm">
                  Volver
                </button>
                <button
                  disabled={!buyer.name || !buyer.lastName || !buyer.phone}
                  onClick={() => setStep(bondType === 'CON_COMIDA' ? 4 : 3)}
                  className="px-6 py-2.5 bg-wine-800 disabled:bg-gray-300 text-white font-bold rounded-2xl text-sm shadow-md"
                >
                  Ver Resumen →
                </button>
              </div>
            </div>
          )}

          {/* PASO: Resumen y Confirmación */}
          {((step === 3 && bondType === 'SIMPLE') || (step === 4 && bondType === 'CON_COMIDA')) && (
            <div className="space-y-4">
              <h3 className="font-extrabold text-wine-900 text-lg">Resumen de Emisión</h3>
              <div className="bg-white p-6 rounded-3xl border border-wine-100 space-y-4 shadow-sm">
                <div className="border-b border-gray-100 pb-3">
                  <span className="text-xs text-gray-400 font-bold uppercase">Comprador</span>
                  <p className="font-bold text-gray-800 text-lg">{buyer.name} {buyer.lastName}</p>
                  <p className="text-xs text-gray-500">📞 {buyer.phone} {buyer.email && `| ✉️ ${buyer.email}`}</p>
                </div>

                <div className="border-b border-gray-100 pb-3 flex justify-between items-center">
                  <div>
                    <span className="text-xs text-gray-400 font-bold uppercase">Tipo de Bono</span>
                    <p className="font-bold text-gray-800">{bondType === 'SIMPLE' ? 'Bono Simple' : 'Bono con Comida'}</p>

                  <span className="text-2xl font-extrabold text-wine-800">

                {bondType === 'CON_COMIDA' && (
                  <div>
                    <span className="text-xs text-gray-400 font-bold uppercase block mb-2">Contenido del Pedido:</span>
                    <div className="bg-wine-50/60 p-4 rounded-2xl space-y-2 border border-wine-100">
                      {activeProducts.filter(p => itemQuantities[p.id] > 0).map((p) => {
                        const q = itemQuantities[p.id];
                        return (
                          <div key={p.id} className="flex justify-between text-sm">
                            <span className="font-bold text-gray-800">{q} × {p.name}</span>

              <div className="flex justify-between pt-4">
                <button onClick={() => setStep(bondType === 'CON_COMIDA' ? 3 : 2)} className="px-5 py-2.5 border border-gray-300 text-gray-700 font-bold rounded-2xl text-sm">

                </button>
                <button onClick={handleGenerateBond} className="px-8 py-3 bg-wine-800 hover:bg-wine-900 text-white font-extrabold rounded-2xl text-sm shadow-xl transform active:scale-95 transition-all">
                  🎉 Generar Bono
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- VISTA LISTADO DE BONOS (Requerimiento 30) ---
    function BondListView({ bonds, sellers, user, navigateTo, setBonds, showToast, showModal }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [filterSeller, setFilterSeller] = useState('ALL');
      const [filterType, setFilterType] = useState('ALL');

      const visibleBonds = bonds.filter((b) => {
        if (user?.role === 'VENDEDOR' && b.sellerId !== user.sellerId && !b.sellerName.toLowerCase().includes('juan')) {
          return false;
        }
        const q = searchTerm.toLowerCase();
        const searchMatch =
          b.number.toString().includes(q) ||
          `${b.buyer?.name} ${b.buyer?.lastName}`.toLowerCase().includes(q) ||
          b.code?.includes(q);

        const statusMatch = filterStatus === 'ALL' || b.status === filterStatus;
        const sellerMatch = filterSeller === 'ALL' || b.sellerId === filterSeller;
        const typeMatch = filterType === 'ALL' || b.type === filterType;

        return searchMatch && statusMatch && sellerMatch && typeMatch;
      });

      const handleAnnull = (e, bondId) => {
        e.stopPropagation();
        showModal('¿Anular Bono?', 'Esta acción cambiará el estado a ANULADO y deshabilitará permanentemente este bono.', 'danger', () => {
          setBonds(bonds.map(b => b.id === bondId ? { ...b, status: 'ANULADO' } : b));
          showToast('Bono anulado correctamente');
        });
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-extrabold text-wine-900">Listado de Bonos</h1>
              <p className="text-sm text-gray-500">{user?.role === 'ADMIN' ? 'Todos los bonos registrados en el evento' : 'Tus bonos emitidos'}</p>
            </div>
            <button onClick={() => navigateTo('bonos/nuevo')} className="px-5 py-2.5 bg-wine-800 hover:bg-wine-900 text-white font-bold rounded-2xl text-sm shadow-md flex items-center justify-center gap-2">
              <Icons.PlusCircle /> Nuevo Bono
            </button>
          </div>

          {/* Filtros */}
          <div className="bg-white p-4 rounded-3xl border border-wine-100 shadow-sm grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
            <div className="relative">
              <input
                type="text"
                placeholder="Buscar por Nº, comprador o código..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="w-full pl-9 pr-3 py-2 text-sm rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-wine-800"
              />
              <span className="absolute left-3 top-2.5 text-gray-400"><Icons.Search /></span>
            </div>

            <div>
              <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} className="w-full px-3 py-2 text-sm rounded-xl border border-gray-200 focus:ring-2 focus:ring-wine-800">
                <option value="ALL">Todos los estados</option>
                <option value="VENDIDO">VENDIDO</option>
                <option value="USADO_ENTRADA">USADO_ENTRADA</option>
                <option value="USADO_COMIDA">USADO_COMIDA</option>
                <option value="ANULADO">ANULADO</option>
              </select>
            </div>

            {user?.role === 'ADMIN' && (
              <div>
                <select value={filterSeller} onChange={(e) => setFilterSeller(e.target.value)} className="w-full px-3 py-2 text-sm rounded-xl border border-gray-200 focus:ring-2 focus:ring-wine-800">
                  <option value="ALL">Todos los vendedores</option>
                  {sellers.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              </div>
            )}

            <div>
              <select value={filterType} onChange={(e) => setFilterType(e.target.value)} className="w-full px-3 py-2 text-sm rounded-xl border border-gray-200 focus:ring-2 focus:ring-wine-800">
                <option value="ALL">Todos los tipos</option>
                <option value="SIMPLE">Bono Simple</option>
                <option value="CON_COMIDA">Con Comida</option>
              </select>
            </div>
          </div>

          {/* Tabla de Bonos */}
          <div className="bg-white rounded-3xl border border-wine-100 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm border-collapse">
                <thead>
                  <tr className="bg-wine-50/80 border-b border-wine-100 text-wine-900 font-bold text-xs uppercase tracking-wider">
                    <th className="p-4">Nº</th>
                    <th className="p-4">Comprador</th>
                    <th className="p-4">Tipo</th>
                    <th className="p-4">Código (4 dígitos)</th>
                    <th className="p-4">Vendedor</th>
                    <th className="p-4">Precio</th>
                    <th className="p-4">Estado</th>
                    <th className="p-4 text-right">Acciones</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {visibleBonds.length === 0 ? (
                    <tr>
                      <td colSpan="8" className="p-8 text-center text-gray-400">No se encontraron bonos coincidentes.</td>
                    </tr>
                  ) : (
                    visibleBonds.map((b) => (
                      <tr key={b.id} onClick={() => navigateTo('bonos/detail', b.id)} className="hover:bg-wine-50/50 cursor-pointer transition-colors">
                        <td className="p-4 font-bold text-wine-900">#{b.number}</td>
                        <td className="p-4 font-semibold text-gray-900">
                          {b.buyer?.name} {b.buyer?.lastName}
                          <span className="block text-xs text-gray-400">{b.buyer?.phone}</span>
                        </td>
                        <td className="p-4 font-medium text-gray-700">{b.type === 'SIMPLE' ? 'Simple' : 'Con Comida 🍔'}</td>
                        <td className="p-4 font-mono font-bold text-gray-800 text-base">{b.code}</td>
                        <td className="p-4 text-gray-600">{b.sellerName}</td>
                        <td className="p-4 font-bold text-gray-900">${b.price?.toLocaleString()}</td>
                        <td className="p-4"><BadgeStatus status={b.status} /></td>
                        <td className="p-4 text-right space-x-2">
                          <button
                            onClick={(e) => { e.stopPropagation(); navigateTo('public', b.publicToken); }}
                            className="px-3 py-1 text-xs bg-wine-50 text-wine-800 hover:bg-wine-100 rounded-xl font-bold inline-flex items-center gap-1"
                          >
                            <Icons.ExternalLink /> Ver Pase
                          </button>
                          {user?.role === 'ADMIN' && b.status !== 'ANULADO' && (
                            <button
                              onClick={(e) => handleAnnull(e, b.id)}
                              className="px-3 py-1 text-xs bg-gray-100 text-rose-700 hover:bg-rose-100 rounded-xl font-bold"
                            >
                              Anular
                            </button>
                          )}
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function BadgeStatus({ status }) {
      let style = 'bg-gray-100 text-gray-700';
      let label = status;

      if (status === 'VENDIDO') {
        style = 'bg-blue-100 text-blue-900 border border-blue-200';
        label = 'VENDIDO';
      } else if (status === 'USADO_ENTRADA') {
        style = 'bg-amber-100 text-amber-900 border border-amber-300';
        label = 'ENTRADA USADA';
      } else if (status === 'USADO_COMIDA') {
        style = 'bg-emerald-100 text-emerald-900 border border-emerald-300';
        label = 'COMIDA ENTREGADA';
      } else if (status === 'ANULADO') {
        style = 'bg-rose-100 text-rose-800 border border-rose-200';
        label = 'ANULADO';
      }

      return (
        <span className={`px-2.5 py-1 rounded-full text-[11px] font-extrabold uppercase tracking-wider ${style}`}>
          {label}
        </span>
      );
    }

    // --- VISTA DETALLE DEL BONO (Requerimiento 31) ---
    function BondDetailView({ bondId, bonds, user, setBonds, navigateTo, showToast, showModal }) {
      const bond = bonds.find(b => b.id === bondId) || bonds[0];
      if (!bond) return <div className="p-8 text-center text-gray-500">Bono no encontrado.</div>;

      const handleCopyLink = () => {
        const url = `${window.location.origin}/b/${bond.publicToken}`;
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(url);
        } else {
          document.execCommand('copy');
        }
        showToast('Enlace público copiado al portapapeles');
      };

      const handleAnnull = () => {
        showModal('¿Confirma la anulación?', `El bono #${bond.number} será marcado como ANULADO y ya no podrá utilizarse en ninguna terminal.`, 'danger', () => {
          setBonds(bonds.map(b => b.id === bond.id ? { ...b, status: 'ANULADO' } : b));
          showToast('Bono anulado');
        });
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <button onClick={() => navigateTo('bonos')} className="p-2 hover:bg-wine-100 text-wine-800 rounded-2xl">
                <Icons.ArrowLeft />
              </button>
              <div>
                <h1 className="text-2xl font-extrabold text-wine-900">Bono #{bond.number}</h1>
                <p className="text-xs text-gray-400">ID: {bond.id} | Fecha venta: {new Date(bond.createdAt).toLocaleDateString()}</p>
              </div>
            </div>
            <BadgeStatus status={bond.status} />
          </div>

          <div className="bg-white rounded-3xl border border-wine-100 shadow-sm p-6 space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 border-b border-gray-100 pb-6">
              <div>
                <span className="text-xs font-bold uppercase text-gray-400 block mb-1">Datos del Comprador</span>
                <p className="font-bold text-gray-800 text-lg">{bond.buyer?.name} {bond.buyer?.lastName}</p>
                <p className="text-sm text-gray-600">📞 {bond.buyer?.phone}</p>
                {bond.buyer?.email && <p className="text-sm text-gray-600">✉️ {bond.buyer?.email}</p>}
              </div>
              <div>
                <span className="text-xs font-bold uppercase text-gray-400 block mb-1">Datos de Venta</span>
                <p className="text-sm font-semibold text-gray-800">Vendedor: {bond.sellerName}</p>
                <p className="text-sm text-gray-600">Tipo: {bond.type === 'SIMPLE' ? 'Bono Simple' : 'Con Comida'}</p>
                <p className="text-base font-extrabold text-wine-800 mt-1">Precio Total: ${bond.price?.toLocaleString()}</p>
              </div>
            </div>

            {/* Código Único y QR (Requerimiento 15) */}
            <div className="bg-wine-50/70 p-5 rounded-3xl border border-wine-200 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div>
                <span className="text-xs font-extrabold uppercase text-wine-800">Código Único de 4 Cifras (Y QR)</span>
                <p className="text-4xl font-mono font-extrabold text-gray-900 mt-1 tracking-widest">{bond.code}</p>
                <p className="text-xs text-gray-500 mt-1">El mismo código identifica el bono en la entrada y en el sector de comida.</p>
              </div>
              <QRRenderer text={bond.code} size={110} />
            </div>

            {/* Auditoría de Uso */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 border-b border-gray-100 pb-6 text-xs">
              <div className="p-3.5 bg-gray-50 rounded-2xl">
                <span className="font-bold text-gray-700 block uppercase mb-1">Estado de Entrada</span>
                {bond.entryUsedAt ? (
                  <p className="text-emerald-800 font-bold">
                    ✓ Utilizada el {new Date(bond.entryUsedAt).toLocaleString()}
                    <br />Por: {bond.entryValidatedBy || 'Vendedor'}
                  </p>
                ) : (
                  <p className="text-gray-500 font-semibold">⏳ Pendiente de uso</p>
                )}
              </div>

              {bond.type === 'CON_COMIDA' && (
                <div className="p-3.5 bg-gray-50 rounded-2xl">
                  <span className="font-bold text-gray-700 block uppercase mb-1">Estado de Comida</span>
                  {bond.foodUsedAt ? (
                    <p className="text-emerald-800 font-bold">
                      ✓ Entregada el {new Date(bond.foodUsedAt).toLocaleString()}
                      <br />Por: {bond.foodValidatedBy || 'Vendedor'}
                    </p>
                  ) : (
                    <p className="text-amber-900 font-semibold">⏳ Pendiente de entrega</p>
                  )}
                </div>
              )}
            </div>

            {/* Detalle del pedido si tiene comida */}
            {bond.type === 'CON_COMIDA' && bond.items && bond.items.length > 0 && (
              <div>
                <h4 className="font-bold text-gray-800 text-sm mb-2">Pedido Incluido:</h4>
                <div className="bg-amber-50/70 p-4 rounded-2xl border border-amber-200/70 space-y-2">
                  {bond.items.map((item, idx) => (
                    <div key={idx} className="flex justify-between text-sm">
                      <span className="font-bold text-amber-950">{item.quantity} × {item.productName}</span>
                      <span className="font-bold text-amber-900">${item.subtotal?.toLocaleString()}</span>
                    </div>
                  ))}

              </div>
            )}

            {/* Acciones */}
            <div className="flex flex-wrap items-center justify-between gap-3 pt-2">
              <div className="flex gap-2">
                <button
                  onClick={() => navigateTo('public', bond.publicToken)}
                  className="px-4 py-2.5 bg-wine-800 text-white font-bold rounded-2xl text-xs flex items-center gap-2 hover:bg-wine-900"
                >
                  <Icons.ExternalLink /> Ver Vista Pública del Comprador

                <button
                  onClick={handleCopyLink}
                  className="px-4 py-2.5 border border-gray-300 text-gray-700 font-bold rounded-2xl text-xs flex items-center gap-2 hover:bg-gray-50"
                >
                  <Icons.Copy /> Copiar Enlace

              {user?.role === 'ADMIN' && bond.status !== 'ANULADO' && (
                <button onClick={handleAnnull} className="px-4 py-2.5 bg-rose-100 text-rose-800 font-bold rounded-2xl text-xs hover:bg-rose-200">
                  Anular Bono
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- VISTA ADMINISTRACIÓN PRODUCTOS (Requerimientos 5 y 6) ---
    function ProductListView({ products, setProducts, simplePrice, setSimplePrice, showToast }) {
      const [showModal, setShowModal] = useState(false);
      const [editingProductId, setEditingProductId] = useState(null);
      const [formData, setFormData] = useState({ name: '', description: '', unitPrice: 3000 });
      const [tempSimplePrice, setTempSimplePrice] = useState(simplePrice);

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (editingProductId) {
          setProducts(products.map(p => p.id === editingProductId ? { ...p, ...formData, unitPrice: Number(formData.unitPrice) } : p));
          showToast('Producto actualizado correctamente');
        } else {
          const newP = {
            id: `p-${Date.now()}`,
            name: formData.name,
            description: formData.description,
            unitPrice: Number(formData.unitPrice),
            active: true,
          };
          setProducts([...products, newP]);
          showToast('Nuevo producto registrado en el catálogo');
        }
        setShowModal(false);
        setEditingProductId(null);
      };

      const handleEdit = (p) => {
        setEditingProductId(p.id);
        setFormData({ name: p.name, description: p.description || '', unitPrice: p.unitPrice });
        setShowModal(true);
      };

      const toggleActive = (id) => {
        setProducts(products.map(p => p.id === id ? { ...p, active: !p.active } : p));
      };

      const handleSaveSimplePrice = () => {
        setSimplePrice(Number(tempSimplePrice));
        showToast('Precio estándar de Bono Simple actualizado');
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-extrabold text-wine-900">Catálogo de Productos</h1>
              <p className="text-sm text-gray-500">Gestión de consumiciones para armar bonos con comida</p>

    // --- VISTA VALIDAR ENTRADA (Requerimientos 21, 22, 23) ---
    function ValidationEntryView({ bonds, setBonds, user, showToast, showModal }) {
      const [manualCode, setManualCode] = useState('');
      const [scannedBond, setScannedBond] = useState(null);
      const [errorMsg, setErrorMsg] = useState('');

      const handleSearchCode = (codeToSearch = manualCode) => {
        setErrorMsg('');
        setScannedBond(null);

        if (codeToSearch.length !== 4) {
          setErrorMsg('El código debe tener exactamente 4 dígitos.');
          return;
        }

        const found = bonds.find(b => b.code === codeToSearch);
        if (!found) {
          setErrorMsg('Código no encontrado o inexistente.');
          return;
        }

        // Reglas de negocio (Requerimiento 28)
        if (found.status === 'ANULADO') {
          showModal('BONO ANULADO', `El bono #${found.number} fue ANULADO y no permite el ingreso al evento.`, 'danger');
          return;
        }

        if (found.status === 'USADO_ENTRADA' || found.status === 'USADO_COMIDA') {
          showModal(
            'ENTRADA YA UTILIZADA',
            `El bono #${found.number} de ${found.buyer?.name} ${found.buyer?.lastName} ya fue utilizado previamente.\n\nFecha: ${new Date(found.entryUsedAt || Date.now()).toLocaleString()}\nValidado por: ${found.entryValidatedBy || 'Vendedor'}`,
            'warning'
          );
          return;
        }

        setScannedBond(found);
      };

      const handleConfirmEntry = () => {
        if (!scannedBond) return;
        setBonds(bonds.map(b => b.id === scannedBond.id ? {
          ...b,
          status: 'USADO_ENTRADA',
          entryUsedAt: new Date().toISOString(),
          entryValidatedBy: user?.name || 'Vendedor Acceso',
        } : b));

        showToast(`✅ Entrada VALIDADA para Bono #${scannedBond.number}`);
        setScannedBond(null);
        setManualCode('');
      };

      return (
        <div className="max-w-xl mx-auto space-y-6">
          <div className="text-center">
            <h1 className="text-2xl font-extrabold text-wine-900">Terminal — Validar Entrada</h1>
            <p className="text-sm text-gray-500">Ingresá el código numérico de 4 cifras o escaneá el QR</p>
          </div>

          <div className="bg-white p-8 rounded-3xl border border-wine-100 shadow-sm text-center space-y-6">
            <div>
              <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Código de 4 dígitos</label>
              <input
                type="text"
                maxLength="4"
                value={manualCode}
                onChange={(e) => setManualCode(e.target.value.replace(/\D/g, ''))}
                placeholder="0000"
                className="w-48 text-center text-4xl font-mono font-extrabold py-3 border-2 border-wine-800 rounded-2xl focus:outline-none focus:ring-4 focus:ring-wine-200 tracking-widest text-wine-900"
              />
            </div>

            <button
              onClick={() => handleSearchCode()}
              disabled={manualCode.length !== 4}
              className="w-full max-w-xs py-3.5 bg-wine-800 disabled:bg-gray-300 hover:bg-wine-900 text-white font-bold rounded-2xl text-sm shadow-md transition-all"
            >
              Buscar Entrada
            </button>

            {errorMsg && (
              <div className="p-3 bg-rose-50 text-rose-800 rounded-2xl text-xs font-bold border border-rose-200">
                ⚠️ {errorMsg}
              </div>
            )}

            {/* Accesos de prueba rápida */}
            <div className="pt-4 border-t border-gray-100">
              <p className="text-xs text-gray-400 mb-2">Prueba rápida con bonos demo:</p>
              <div className="flex flex-wrap justify-center gap-2">
                <button onClick={() => { setManualCode('4821'); handleSearchCode('4821'); }} className="px-2.5 py-1 bg-wine-50 text-wine-900 text-xs font-bold rounded-xl hover:bg-wine-100">
                  #125 Vendido [4821]
                </button>
                <button onClick={() => { setManualCode('5832'); handleSearchCode('5832'); }} className="px-2.5 py-1 bg-amber-50 text-amber-900 text-xs font-bold rounded-xl hover:bg-amber-100">
                  #126 Usado [5832]
                </button>
                <button onClick={() => { setManualCode('3310'); handleSearchCode('3310'); }} className="px-2.5 py-1 bg-rose-50 text-rose-800 text-xs font-bold rounded-xl hover:bg-rose-100">
                  #127 Anulado [3310]
                </button>
              </div>
            </div>
          </div>

          {/* Diálogo de Confirmación */}
          {scannedBond && (
            <div className="bg-white rounded-3xl border-2 border-wine-800 p-6 shadow-2xl space-y-4">
              <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 className="font-extrabold text-wine-900 text-lg">Confirmar Ingreso al Evento</h3>
                <span className="font-mono font-bold text-gray-500">Bono #{scannedBond.number}</span>
              </div>

              <div className="space-y-2 text-sm">
                <div className="flex justify-between">
                  <span className="text-gray-500">Comprador:</span>
                  <span className="font-bold text-gray-900">{scannedBond.buyer?.name} {scannedBond.buyer?.lastName}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-gray-500">Tipo:</span>
                  <span className="font-bold text-gray-900">{scannedBond.type === 'SIMPLE' ? 'Bono Simple' : 'Bono con Comida'}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-gray-500">Estado:</span>
                  <BadgeStatus status={scannedBond.status} />
                </div>
                {scannedBond.type === 'CON_COMIDA' && (
                  <div className="p-3 bg-amber-50 rounded-2xl text-xs text-amber-900 font-bold border border-amber-200">
                    🍔 Posee menú de comida incluido para canjear luego en el sector comida.
                  </div>
                )}
              </div>

              <div className="flex gap-3 pt-2">
                <button onClick={() => setScannedBond(null)} className="flex-1 py-2.5 border border-gray-300 text-gray-700 font-bold rounded-2xl text-sm">
                  Cancelar
                </button>
                <button onClick={handleConfirmEntry} className="flex-1 py-2.5 bg-wine-800 hover:bg-wine-900 text-white font-bold rounded-2xl text-sm shadow-md">
                  Confirmar Entrada ✓
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ValidationFoodView({ bonds, setBonds, user, showToast, showModal }) {

          showModal('BONO ANULADO', `El bono #${found.number} está ANULADO y no permite retiro de comida.`, 'danger');

                placeholder="0000"
                className="w-48 text-center text-4xl font-mono font-extrabold py-3 border-2 border-amber-800 rounded-2xl focus:outline-none focus:ring-4 focus:ring-amber-200 tracking-widest text-amber-950"
              />
            </div>

            <button
              onClick={() => handleSearchCode()}
              disabled={manualCode.length !== 4}

            <div className="pt-4 border-t border-gray-100">

          {/* TARJETA TICKET MÓVIL ESTILO PASS CON MUESCAS */}
          <div className="w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden border border-wine-200 relative">
            <div className="bg-wine-800 text-white p-6 text-center relative">
              <span className="text-xs font-bold tracking-widest uppercase text-wine-200">Pase Oficial de Evento</span>
              <h2 className="text-2xl font-extrabold mt-1">Bono #{bond.number}</h2>
              <p className="text-sm font-semibold text-wine-100">{bond.buyer?.name} {bond.buyer?.lastName}</p>
            </div>

            <div className="p-6 space-y-6">
              {bond.status === 'ANULADO' ? (
                <div className="bg-rose-50 border-2 border-rose-300 p-6 rounded-2xl text-center space-y-2">
                  <span className="text-4xl block">⚠️</span>
                  <h3 className="font-extrabold text-rose-800 text-xl">BONO ANULADO</h3>
                  <p className="text-xs text-rose-700 font-medium">Este bono ha sido anulado y no es válido para ingreso ni comida.</p>
                </div>
              ) : bond.status === 'VENDIDO' ? (
                /* ESTADO 1: ENTRADA PENDIENTE */
                <div className="text-center space-y-4">
                  <div className="inline-block bg-blue-100 text-blue-900 px-3.5 py-1 rounded-full text-xs font-extrabold uppercase tracking-wider">
                    ENTRADA PENDIENTE
                  </div>

                  {/* QR Real Renderizado */}
                  <div className="flex justify-center">
                    <QRRenderer text={bond.code} size={150} />
                  </div>

                  <div>
                    <span className="text-xs text-gray-400 font-bold uppercase tracking-wider">Código de 4 Cifras</span>
                    <p className="text-4xl font-mono font-extrabold text-wine-800 tracking-widest mt-0.5">{bond.code}</p>
                  </div>

                  {bond.type === 'CON_COMIDA' && bond.items && (
                    <div className="bg-amber-50 p-3.5 rounded-2xl border border-amber-200 text-left">
                      <span className="text-xs font-bold text-amber-900 uppercase block mb-1">Menú Incluido:</span>
                      {bond.items.map((item, idx) => (
                        <div key={idx} className="flex justify-between text-xs font-bold text-amber-900">
                          <span>• {item.productName}</span>
                          <span>x{item.quantity}</span>
                        </div>
                      ))}
                    </div>
                  )}

                  <p className="text-xs text-gray-500 font-medium">
                    Presentá este QR o código al ingresar al evento. No necesitás conexión a internet durante el evento.
                  </p>
                </div>
              ) : bond.status === 'USADO_ENTRADA' ? (
                /* ESTADO 2: ENTRADA UTILIZADA (Si tiene comida, muestra mismo QR) */
                <div className="space-y-5">
                  <div className="bg-emerald-50 text-emerald-800 p-4 rounded-2xl text-center border border-emerald-200">
                    <p className="font-extrabold text-base">Entrada registrada ✓</p>
                    <p className="text-xs text-emerald-600">¡Bienvenido al evento!</p>
                  </div>

                  {bond.type === 'CON_COMIDA' ? (
                    <div className="text-center space-y-4 pt-2 border-t border-dashed border-gray-200">
                      <div className="inline-block bg-amber-100 text-amber-900 px-3 py-1 rounded-full text-xs font-extrabold uppercase tracking-wider">
                        VALE DE COMIDA PENDIENTE
                      </div>

                      <div className="bg-amber-50 p-4 rounded-2xl text-left border border-amber-200 space-y-1">
                        <span className="text-xs font-bold text-amber-900 uppercase block mb-1">Pedido a retirar:</span>
                        {bond.items?.map((item, idx) => (
                          <div key={idx} className="flex justify-between text-sm font-bold text-amber-900">
                            <span>• {item.productName}</span>
                            <span>x{item.quantity}</span>
                          </div>
                        ))}
                      </div>

                      {/* Mismo QR */}
                      <div className="flex justify-center">
                        <QRRenderer text={bond.code} size={130} />
                      </div>

                      <div>
                        <span className="text-xs text-gray-400 font-bold uppercase tracking-wider">Mismo Código Único</span>
                        <p className="text-3xl font-mono font-extrabold text-amber-950 tracking-widest mt-0.5">{bond.code}</p>
                      </div>

                      <p className="text-xs text-gray-500 font-medium">
                        Presentá este mismo código en el sector de comidas.
                      </p>
                    </div>
                  ) : (
                    <p className="text-xs text-center text-gray-500 font-medium">Gracias por su colaboración.</p>
                  )}
                </div>
              ) : bond.status === 'USADO_COMIDA' ? (
                /* ESTADO 3: ENTRADA Y COMIDA ENTREGADA */
                <div className="space-y-4 text-center">
                  <div className="bg-emerald-50 text-emerald-800 p-4 rounded-2xl border border-emerald-200 space-y-1">
                    <p className="font-extrabold text-base">Entrada registrada ✓</p>
                    <p className="font-extrabold text-base">Comida entregada ✓</p>
                  </div>

                  {bond.items && (
                    <div className="bg-gray-50 p-4 rounded-2xl text-left border border-gray-200 space-y-1">
                      <span className="text-xs font-bold text-gray-500 uppercase block mb-1">Consumido:</span>
                      {bond.items.map((item, idx) => (
                        <div key={idx} className="flex justify-between text-sm text-gray-700 font-semibold">
                          <span>• {item.productName}</span>
                          <span>x{item.quantity}</span>
                        </div>
                      ))}
                    </div>
                  )}

                  <p className="text-xs text-gray-500 pt-2 font-medium">Gracias por su colaboración.</p>
                </div>
              ) : null}

              <div className="border-t border-gray-100 pt-4 text-center text-[11px] text-gray-400 space-y-0.5 font-medium">
                <p>Vendedor: {bond.sellerName}</p>
                <p>Tipo: {bond.type === 'SIMPLE' ? 'Bono Simple' : 'Bono con Comida'}</p>
                <p className="font-bold text-gray-600 mt-1">Total: ${bond.price?.toLocaleString()}</p>
              </div>
            </div>

            {/* Muescas decorativas de ticket */}
            <div className="absolute left-0 top-28 ticket-cutout-left -ml-2"></div>
            <div className="absolute right-0 top-28 ticket-cutout-right -mr-2"></div>
          </div>
        </div>
      );
    }

    // Montaje de la aplicación
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
